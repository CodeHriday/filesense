version: 2

sources:
  - name: uploaded_files
    description: Files uploaded through the Data File Observatory platform
    database: "{{ env_var('PGDATABASE') }}"
    schema: public
    tables:
      - name: files
        description: File metadata and catalog
        columns:
          - name: file_id
            description: Unique file identifier
            tests:
              - unique
              - not_null
          - name: filename
            description: Original filename
          - name: file_type
            description: File extension (csv, json, parquet, xlsx, xml)
          - name: file_size
            description: File size in bytes
          - name: row_count
            description: Number of rows in the file
          - name: column_count
            description: Number of columns in the file
          - name: created_at
            description: Upload timestamp
