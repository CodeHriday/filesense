# FreshClam Configuration for Data File Observatory
# Custom configuration for downloading virus definitions

# Database directory (where virus definitions will be stored)
DatabaseDirectory /home/runner/workspace/clamav-db

# Use system log
LogSyslog yes
LogTime yes
LogVerbose no

# Database mirror
DatabaseMirror database.clamav.net

# Number of database checks per day (24 = hourly when running as daemon)
Checks 24

# Maximum number of attempts to download
MaxAttempts 3

# Connect timeout (seconds)
ConnectTimeout 30

# Receive timeout (seconds)
ReceiveTimeout 60

# Use DNS for database version queries
DNSDatabaseInfo current.cvd.clamav.net

# Bytecode updates
Bytecode yes

# Don't require Example line to be commented out (we're not using a sample config)
# Example
