<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="#F5F5F5" rx="8" ry="8"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">Data Profile Overview</text>
  
  <!-- Chart 1: Bar chart for column completeness -->
  <g transform="translate(20, 60)">
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#666666">Column Completeness</text>
    
    <!-- Bars -->
    <rect x="0" y="10" width="150" height="15" fill="#2196F3" rx="2" ry="2"/>
    <rect x="0" y="35" width="120" height="15" fill="#2196F3" rx="2" ry="2"/>
    <rect x="0" y="60" width="160" height="15" fill="#2196F3" rx="2" ry="2"/>
    <rect x="0" y="85" width="100" height="15" fill="#2196F3" rx="2" ry="2"/>
    
    <!-- Labels -->
    <text x="155" y="22" font-family="Arial, sans-serif" font-size="10" fill="#333333">94%</text>
    <text x="125" y="47" font-family="Arial, sans-serif" font-size="10" fill="#333333">76%</text>
    <text x="165" y="72" font-family="Arial, sans-serif" font-size="10" fill="#333333">100%</text>
    <text x="105" y="97" font-family="Arial, sans-serif" font-size="10" fill="#333333">63%</text>
  </g>
  
  <!-- Chart 2: Pie chart for data types -->
  <g transform="translate(250, 120)">
    <text x="0" y="-45" font-family="Arial, sans-serif" font-size="12" fill="#666666">Data Types</text>
    
    <!-- Pie segments -->
    <path d="M0,0 L50,0 A50,50 0 0,1 35.36,35.36 Z" fill="#2196F3"/>
    <path d="M0,0 L35.36,35.36 A50,50 0 0,1 -35.36,35.36 Z" fill="#4CAF50"/>
    <path d="M0,0 L-35.36,35.36 A50,50 0 0,1 -50,0 Z" fill="#FFC107"/>
    <path d="M0,0 L-50,0 A50,50 0 0,1 -35.36,-35.36 Z" fill="#9C27B0"/>
    <path d="M0,0 L-35.36,-35.36 A50,50 0 0,1 0,-50 Z" fill="#F44336"/>
    <path d="M0,0 L0,-50 A50,50 0 0,1 50,0 Z" fill="#00BCD4"/>
    
    <!-- Legend -->
    <g transform="translate(0, 70)">
      <rect x="-45" y="0" width="10" height="10" fill="#2196F3"/>
      <text x="-30" y="9" font-family="Arial, sans-serif" font-size="9" fill="#333333">String</text>
      
      <rect x="5" y="0" width="10" height="10" fill="#4CAF50"/>
      <text x="20" y="9" font-family="Arial, sans-serif" font-size="9" fill="#333333">Number</text>
      
      <rect x="-45" y="15" width="10" height="10" fill="#FFC107"/>
      <text x="-30" y="24" font-family="Arial, sans-serif" font-size="9" fill="#333333">Date</text>
      
      <rect x="5" y="15" width="10" height="10" fill="#F44336"/>
      <text x="20" y="24" font-family="Arial, sans-serif" font-size="9" fill="#333333">Boolean</text>
    </g>
  </g>
  
  <!-- Statistics -->
  <g transform="translate(20, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#666666">File Statistics</text>
    
    <rect x="0" y="10" width="160" height="70" fill="white" stroke="#E0E0E0" stroke-width="1" rx="4" ry="4"/>
    
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666666">Row Count:</text>
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333333">1,245</text>
    
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666666">Columns:</text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333333">8</text>
    
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666666">File Size:</text>
    <text x="80" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333333">2.4 MB</text>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666666">Quality Score:</text>
    <text x="80" y="75" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2196F3">87%</text>
  </g>
</svg>