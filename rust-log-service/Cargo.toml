[package]
name = "log-service"
version = "0.1.0"
edition = "2021"
description = "High-performance log ingestion, compression, indexing, and retrieval service"
authors = ["Data Observatory Team"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["json", "ws"] }
tower = { version = "0.4", features = ["timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-zstd"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parquet for columnar storage
parquet = { version = "53.0", features = ["zstd", "snap"] }
arrow = { version = "53.0", features = ["prettyprint"] }

# Full-text search indexing
tantivy = "0.22"

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Embedded key-value store for metadata
sled = "0.34"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"

# Async channels for pipeline
flume = "0.11"

# Bloom filters for fast lookups
bloomfilter = "1.0"

# Hash functions
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Memory-mapped files
memmap2 = "0.9"

# Async file I/O
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client for health checks
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.9"

[[bin]]
name = "log-service"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
