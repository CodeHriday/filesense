# SonarQube Configuration for Data File Observatory
# Multi-language project: JavaScript/TypeScript (Backend + Frontend) + Python

# Project identification
sonar.projectKey=filevantage-main
sonar.projectName=fileVantage-main
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src,backend,profile_api.py

# Test directories
sonar.tests=src/tests,backend/tests,tests/python

# Exclusions from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/__tests__/**,\
  **/tests/**,\
  **/.pythonlibs/**,\
  **/migrations/**,\
  **/scripts/**

# Test exclusions (what not to count as source)
sonar.test.exclusions=\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/__tests__/**,\
  **/tests/**

# ============================================
# JavaScript/TypeScript Configuration
# ============================================
sonar.javascript.lcov.reportPaths=\
  coverage/backend/lcov.info,\
  coverage/frontend/lcov.info

sonar.typescript.lcov.reportPaths=\
  coverage/backend/lcov.info,\
  coverage/frontend/lcov.info

# JavaScript file extensions
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# ============================================
# Python Configuration
# ============================================
sonar.python.version=3.11

sonar.python.coverage.reportPaths=coverage/python/coverage.xml

# Python source files
sonar.python.file.suffixes=.py

# ============================================
# Encoding
# ============================================
sonar.sourceEncoding=UTF-8

# ============================================
# Duplication detection
# ============================================
sonar.cpd.exclusions=\
  **/tests/**,\
  **/*.test.*,\
  **/*.spec.*
