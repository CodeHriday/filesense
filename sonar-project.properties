# ============================================
# SonarQube Configuration for Data File Observatory
# Multi-language project: JavaScript/TypeScript (Backend + Frontend) + Python
# Coverage is ignored for now
# ============================================

# Project identification
sonar.projectKey=filesense-main
sonar.projectName=filesense-main
sonar.projectVersion=1.0.0

# Source directories (exclude coverage entirely)
sonar.sources=src,backend,profile_api.py

# Test directories
sonar.tests=src/tests,backend/tests,tests/python

# Exclusions from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/__tests__/**,\
  **/tests/**,\
  **/.pythonlibs/**,\
  **/migrations/**,\
  **/scripts/**

# Test exclusions (what not to count as source)
sonar.test.exclusions=\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/__tests__/**,\
  **/tests/**

# ============================================
# JavaScript/TypeScript Configuration
# ============================================
# Coverage ignored completely
# Remove lcov report paths for now
# sonar.javascript.lcov.reportPaths=
# sonar.typescript.lcov.reportPaths=

# JavaScript file extensions
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# ============================================
# Python Configuration
# ============================================
sonar.python.version=3.11

# Coverage ignored completely
# sonar.python.coverage.reportPaths=

# Python source files
sonar.python.file.suffixes=.py

# ============================================
# Encoding
# ============================================
sonar.sourceEncoding=UTF-8

# ============================================
# Duplication detection
# Exclude tests and coverage to avoid warnings
# ============================================
sonar.cpd.exclusions=\
  **/tests/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/coverage/**
